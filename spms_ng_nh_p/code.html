<form class="p-8 flex flex-col gap-form-gap" onsubmit="event.preventDefault(); window.location.href='{{DATA:SCREEN:SCREEN_14}}';">

</div>
</div>
<div class="flex flex-col gap-2">

<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>

<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-1">

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
